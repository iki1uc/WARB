<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WARB – Tiefe, Farben, Matrix, CHESS81, INDEX</title>

<style>
body { background:#000; color:#0f0; font-family:monospace; }
pre { border:1px solid #0f0; padding:10px; }
h2 { color:#0f0; }
</style>

<script type="module">

import { WARB_MASTER } from "./M/warb.master.js";
import { buildWARBMatrix9 } from "./M/warb.matrix.js";
import { INDEX_WARB_INTEGRATION } from "./INDEX/core/INDEX.warb.js";

async function start(){

    const warbList = await WARB_MASTER();
    const warbMatrix = buildWARBMatrix9(warbList);

    const respoList = window.RESPO_INDEX?.ALL || [];

    const merged = INDEX_WARB_INTEGRATION(respoList, warbList);

    document.getElementById("warbMatrix").innerText =
        JSON.stringify(warbMatrix, null, 2);

    document.getElementById("warbIndex").innerText =
        JSON.stringify(merged, null, 2);
}

start();

</script>
</head>
<body>

<h1>WARB – Tiefe, Farben, Matrix, CHESS81, INDEX</h1>

<h2>WARB 9×9 Matrix</h2>
<pre id="warbMatrix"></pre>

<h2>INDEX + WARB Integration</h2>
<pre id="warbIndex"></pre>

</body>
</html>
